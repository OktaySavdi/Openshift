---
# Docker registry secret for pulling private images
# Used by GT Operators to pull images from private registry
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: gt-operators
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "{{ docker_registry_url }}": {
          "username": "{{ vault_docker_username }}",
          "password": "{{ vault_docker_password }}",
          "email": "{{ docker_registry_email | default('noreply@example.com') }}",
          "auth": "{{ (vault_docker_username + ':' + vault_docker_password) | b64encode }}"
        }
      }
    }
