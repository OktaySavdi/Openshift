---
# Grant privileged SCC to Falco ServiceAccount
# Falco requires privileged access to monitor system calls and access host resources
apiVersion: v1
kind: List
items:
  # Add falco service account to privileged SCC
  - apiVersion: security.openshift.io/v1
    kind: SecurityContextConstraints
    metadata:
      name: falco-privileged
    allowHostDirVolumePlugin: true
    allowHostIPC: true
    allowHostNetwork: true
    allowHostPID: true
    allowHostPorts: true
    allowPrivilegedContainer: true
    allowedCapabilities:
      - '*'
    defaultAddCapabilities: null
    fsGroup:
      type: RunAsAny
    readOnlyRootFilesystem: false
    requiredDropCapabilities: null
    runAsUser:
      type: RunAsAny
    seLinuxContext:
      type: RunAsAny
    supplementalGroups:
      type: RunAsAny
    users:
      - system:serviceaccount:falco:falco
    volumes:
      - '*'
