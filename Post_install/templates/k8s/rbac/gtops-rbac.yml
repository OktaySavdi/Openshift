apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gtops-operators-readonly
rules:
  # Operator viewing permissions
  - apiGroups:
      - operators.coreos.com
      - olm.operatorframework.io
    resources:
      - clusterserviceversions
      - catalogsources
      - installplans
      - subscriptions
      - operatorgroups
      - operators
      - operatorconditions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - packages.operators.coreos.com
    resources:
      - packagemanifests
      - packagemanifests/icon
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - config.openshift.io
    resources:
      - operatorhubs
      - infrastructures
      - clusterversions
      - clusteroperators
      - dnses
      - networks
      - ingresses
      - apiservers
      - authentications
      - oauths
      - proxies
      - schedulers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - operator.openshift.io
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - console.openshift.io
    resources:
      - consoleplugins
      - consolelinks
      - consolenotifications
      - consoleexternalloglinks
      - consolequickstarts
      - consoleyamlsamples
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  # Namespace viewing
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
      - project.openshift.io
    resources:
      - projects
    verbs:
      - get
      - list
      - watch