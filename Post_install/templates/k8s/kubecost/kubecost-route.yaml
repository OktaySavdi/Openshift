apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kubecost-ui
  namespace: kubecost
  labels:
    app: kubecost
spec:
  to:
    kind: Service
    name: kubecost-instance-cost-analyzer
    weight: 100
  port:
    targetPort: 9090
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
