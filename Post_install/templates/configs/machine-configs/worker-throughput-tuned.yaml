apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: worker-throughput
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
  - data: |
      [main]
      summary=Optimize for high throughput on worker nodes
      include=throughput-performance
      
      [sysctl]
      # Network buffer sizes - increases throughput for data-intensive workloads
      net.core.rmem_max=134217728                              # Max receive buffer 128MB (default: 212992, allows large TCP windows)
      net.core.wmem_max=134217728                              # Max send buffer 128MB (default: 212992, reduces packet loss on bursts)
      net.ipv4.tcp_rmem=4096 87380 67108864                    # TCP receive buffer: min 4KB, default 85KB, max 64MB
      net.ipv4.tcp_wmem=4096 65536 67108864                    # TCP send buffer: min 4KB, default 64KB, max 64MB
      
      # TCP congestion control - optimizes for high-bandwidth networks
      net.ipv4.tcp_congestion_control=cubic                    # CUBIC algorithm (better for high-bandwidth, long-distance links)
      
      [vm]
      transparent_hugepages=madvise                            # Enable THP only when applications request it (balances performance and memory overhead)
    name: worker-throughput
  recommend:
  - match:
    - label: node-role.kubernetes.io/worker
    priority: 8
    profile: worker-throughput
